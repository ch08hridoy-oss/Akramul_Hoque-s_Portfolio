<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Note | Akramul Hoque Demo</title><link rel="stylesheet" href="../../style.css"><style>
body{background:#f5f7ff}.demo-head{background:#09152f;color:white;padding:22px 5%}.demo-head .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}.demo-head a{color:#a9c6ff}.demo-main{width:min(1000px,92%);margin:45px auto;min-height:55vh}.demo-card{background:#fff;border:1px solid #e6eaf3;border-radius:18px;padding:22px;box-shadow:0 12px 30px #17244b0a}.demo-title{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}.demo-title h1{font:800 32px Manrope;margin:0}.muted{color:#6c7890;font-size:13px}.demo-btn{border:0;border-radius:9px;background:linear-gradient(100deg,#6844f6,#ef489b);color:white;padding:10px 15px;font-weight:700;cursor:pointer}input,select,textarea{border:1px solid #dfe5f2;border-radius:9px;padding:11px;min-width:0}.article{border:1px solid #e7eaf4;border-radius:14px;padding:18px;background:linear-gradient(140deg,#fff,#f7f5ff)}.article .emoji{font-size:30px}.article small{color:#7956dc;font-weight:700}.article h3{font:800 17px Manrope}.article p{font-size:12px;color:#68738b}</style></head><body><header class="demo-head"><div class="wrap"><a href="../../index.html">← Back to Akramul's Portfolio</a><span>Interactive Project Demo</span></div></header><main class="demo-main"><div class="demo-title"><div><p class="kicker">THOUGHTS, TUTORIALS & IDEAS</p><h1>The Daily Note ✍️</h1><p class="muted">A simple blog demo with search and category filters.</p></div><a class="btn" href="../../index.html">Main Portfolio</a></div><div class="demo-card"><input id="blogSearch" placeholder="Search articles..." style="width:min(100%,400px)"><div style="display:flex;gap:8px;flex-wrap:wrap;margin:15px 0"><button class="demo-btn" data-cat="All">All</button><button class="demo-btn" data-cat="Web Development">Web Development</button><button class="demo-btn" data-cat="Design">Design</button><button class="demo-btn" data-cat="Learning">Learning</button></div><div id="articles" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px"></div></div></main><footer class="footer"><a class="brand" href="../../index.html"><span class="code-mark">&lt;/&gt;</span> Akramul<span class="grad">.</span></a><small>Educational demo · No production data</small></footer><script>const articles=[{title:'How I Build a Responsive Website',cat:'Web Development',emoji:'💻',desc:'A beginner-friendly overview of flexible layouts, breakpoints and testing.'},{title:'Choosing Colors for a Clean UI',cat:'Design',emoji:'🎨',desc:'Simple ways to create a balanced palette and readable interface.'},{title:'Learning JavaScript by Doing',cat:'Learning',emoji:'🧠',desc:'Small interactive projects can help turn concepts into real skills.'},{title:'Organizing a Small Portfolio',cat:'Web Development',emoji:'🗂️',desc:'Make projects easier to explore with clear descriptions and live demos.'},{title:'Design Details That Build Trust',cat:'Design',emoji:'✨',desc:'Consistent spacing, helpful labels and accessible contrast matter.'}];let cat='All';function render(){let q=document.querySelector('#blogSearch').value.toLowerCase();let list=articles.filter(a=>(cat==='All'||a.cat===cat)&&(a.title+' '+a.desc+' '+a.cat).toLowerCase().includes(q));document.querySelector('#articles').innerHTML=list.map(a=>`<article class="article"><div class="emoji">${a.emoji}</div><small>${a.cat}</small><h3>${a.title}</h3><p>${a.desc}</p><a href="#" onclick="alert('This is sample blog content for the portfolio demo.');return false" style="font-weight:800;font-size:12px;color:#7956dc">Read article →</a></article>`).join('')||'<p>No articles match your search.</p>'}document.querySelector('#blogSearch').addEventListener('input',render);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});render();</script></body></html>
