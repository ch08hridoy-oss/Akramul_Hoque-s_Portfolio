<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopiGo E-commerce | Akramul Hoque Demo</title><link rel="stylesheet" href="../../style.css"><style>
body{background:#f5f7ff}.demo-head{background:#09152f;color:white;padding:22px 5%}.demo-head .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}.demo-head a{color:#a9c6ff}.demo-main{width:min(1000px,92%);margin:45px auto;min-height:55vh}.demo-card{background:#fff;border:1px solid #e6eaf3;border-radius:18px;padding:22px;box-shadow:0 12px 30px #17244b0a}.demo-title{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}.demo-title h1{font:800 32px Manrope;margin:0}.muted{color:#6c7890;font-size:13px}.demo-btn{border:0;border-radius:9px;background:linear-gradient(100deg,#6844f6,#ef489b);color:white;padding:10px 15px;font-weight:700;cursor:pointer}input,select,textarea{border:1px solid #dfe5f2;border-radius:9px;padding:11px;min-width:0}.pitem{border:1px solid #e5e9f5;border-radius:13px;padding:14px;background:#fff}.pemoji{font-size:45px;background:#f0edff;border-radius:12px;text-align:center;padding:15px}.pitem h3{font-size:14px}.pitem p{font-size:12px;color:#69758c}</style></head><body><header class="demo-head"><div class="wrap"><a href="../../index.html">← Back to Akramul's Portfolio</a><span>Interactive Project Demo</span></div></header><main class="demo-main"><div class="demo-title"><div><p class="kicker">SHOP SMART · LIVE BETTER</p><h1>ShopiGo Store 🛍️</h1><p class="muted">Sample products · Add items to your demo bag</p></div><button class="demo-btn" id="showCart">Cart (<span id="count">0</span>)</button></div><div class="demo-card"><input id="search" placeholder="Search products..." style="width:min(100%,400px)"><div id="products" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:20px"></div></div><div class="demo-card" id="cartBox" style="margin-top:20px;display:none"><h2>Your demo bag</h2><div id="cartList"></div><b id="total"></b><p class="muted">No real payment is processed.</p></div></main><footer class="footer"><a class="brand" href="../../index.html"><span class="code-mark">&lt;/&gt;</span> Akramul<span class="grad">.</span></a><small>Educational demo · No production data</small></footer><script>const data=[['Everyday Sneakers','Fashion','👟',1890],['Aura Headphones','Tech','🎧',3290],['Ceramic Kitchen Set','Home','🍵',1590],['Glow Skincare Set','Beauty','🌸',1290],['Outdoor Backpack','Sports','🎒',2790],['Little Joy Toys','Kids','🧸',990]];let cart=[];const products=document.querySelector('#products');function render(){let q=document.querySelector('#search').value.toLowerCase();products.innerHTML=data.filter(p=>p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q)).map((p,i)=>`<article class="pitem"><div class="pemoji">${p[2]}</div><h3>${p[0]}</h3><p>${p[1]}</p><b>৳${p[3].toLocaleString()}</b><p><button class="demo-btn" onclick="addItem(${data.indexOf(p)})">Add to bag +</button></p></article>`).join('')||'<p>No products found.</p>'}function addItem(i){cart.push(data[i]);document.querySelector('#count').textContent=cart.length;renderCart()}function renderCart(){document.querySelector('#cartList').innerHTML=cart.map(p=>`<p>${p[2]} ${p[0]} — ৳${p[3].toLocaleString()}</p>`).join('')||'Your bag is empty';document.querySelector('#total').textContent='Total: ৳'+cart.reduce((s,p)=>s+p[3],0).toLocaleString()}document.querySelector('#search').addEventListener('input',render);document.querySelector('#showCart').onclick=()=>{let b=document.querySelector('#cartBox');b.style.display=b.style.display==='none'?'block':'none';renderCart()};render();</script></body></html>
