<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow | Akramul Hoque Demo</title><link rel="stylesheet" href="../../style.css"><style>
body{background:#f5f7ff}.demo-head{background:#09152f;color:white;padding:22px 5%}.demo-head .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}.demo-head a{color:#a9c6ff}.demo-main{width:min(1000px,92%);margin:45px auto;min-height:55vh}.demo-card{background:#fff;border:1px solid #e6eaf3;border-radius:18px;padding:22px;box-shadow:0 12px 30px #17244b0a}.demo-title{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}.demo-title h1{font:800 32px Manrope;margin:0}.muted{color:#6c7890;font-size:13px}.demo-btn{border:0;border-radius:9px;background:linear-gradient(100deg,#6844f6,#ef489b);color:white;padding:10px 15px;font-weight:700;cursor:pointer}input,select,textarea{border:1px solid #dfe5f2;border-radius:9px;padding:11px;min-width:0}.taskrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f8}.taskrow span{flex:1}.taskrow.done span{text-decoration:line-through;color:#8992a8}.taskrow button{border:1px solid #e4e8f2;background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer}</style></head><body><header class="demo-head"><div class="wrap"><a href="../../index.html">← Back to Akramul's Portfolio</a><span>Interactive Project Demo</span></div></header><main class="demo-main"><div class="demo-title"><div><p class="kicker">STAY ON TRACK</p><h1>TaskFlow</h1><p class="muted">A small interactive task manager demo.</p></div><span class="pill">Local browser demo</span></div><div class="demo-card"><form id="taskForm" style="display:flex;gap:10px;flex-wrap:wrap"><input id="taskInput" required placeholder="What needs to get done?" style="flex:1"><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><button class="demo-btn">Add task +</button></form><div style="display:flex;gap:8px;margin:20px 0;flex-wrap:wrap"><button class="demo-btn" data-filter="All">All</button><button class="demo-btn" data-filter="Active">Active</button><button class="demo-btn" data-filter="Done">Completed</button></div><p class="muted" id="taskStats"></p><div id="taskList"></div></div></main><footer class="footer"><a class="brand" href="../../index.html"><span class="code-mark">&lt;/&gt;</span> Akramul<span class="grad">.</span></a><small>Educational demo · No production data</small></footer><script>let tasks=[{text:'Plan the next project',priority:'High',done:false},{text:'Practice responsive CSS',priority:'Normal',done:true}];let filter='All';function render(){let shown=tasks.map((t,i)=>({...t,i})).filter(t=>filter==='All'||(filter==='Done'?t.done:!t.done));document.querySelector('#taskStats').textContent=`${tasks.filter(t=>!t.done).length} active · ${tasks.filter(t=>t.done).length} completed`;document.querySelector('#taskList').innerHTML=shown.map(t=>`<div class="taskrow ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.i})"><span>${t.text} <small style="color:#8b5cf6">· ${t.priority}</small></span><button onclick="deleteTask(${t.i})">Delete</button></div>`).join('')||'<p class="muted">No tasks in this view.</p>'}function toggleTask(i){tasks[i].done=!tasks[i].done;render()}function deleteTask(i){tasks.splice(i,1);render()}document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.unshift({text:document.querySelector('#taskInput').value.trim(),priority:document.querySelector('#priority').value,done:false});document.querySelector('#taskInput').value='';render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();</script></body></html>
